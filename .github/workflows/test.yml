name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  devtools:
    name: Build Devtools Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache devtools image
        id: cache-devtools
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Build devtools image
        if: steps.cache-devtools.outputs.cache-hit != 'true'
        run: make devtools-image

      - name: Save devtools image to cache
        if: steps.cache-devtools.outputs.cache-hit != 'true'
        run: docker save arubacloud-resource-operator-devtools:local -o /tmp/devtools-image.tar

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: [devtools]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore devtools image
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Load devtools image
        run: |
          docker load -i /tmp/devtools-image.tar
          mkdir -p bin && touch bin/.devtools-image.stamp

      - name: Run linter
        run: make lint-ctzd

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [devtools]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore devtools image
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Load devtools image
        run: |
          docker load -i /tmp/devtools-image.tar
          mkdir -p bin && touch bin/.devtools-image.stamp

      - name: Build manager binary
        run: make build-ctzd

      - name: Build Docker image
        run: make docker-build IMG=controller:test

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [devtools]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore devtools image
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Load devtools image
        run: |
          docker load -i /tmp/devtools-image.tar
          mkdir -p bin && touch bin/.devtools-image.stamp

      - name: Run tests
        run: make test-ctzd

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./cover.out
          fail_ci_if_error: false
