---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - arubacloud.com
  resources:
  - blockstorages
  - vpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arubacloud.com
  resources:
  - blockstorages/finalizers
  - vpcs/finalizers
  verbs:
  - update
- apiGroups:
  - arubacloud.com
  resources:
  - blockstorages/status
  - vpcs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - arubacloud.com
  resources:
  - projects
  verbs:
  - get
  - list
  - watch
