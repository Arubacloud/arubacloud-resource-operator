name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/website/**'
      - 'docs/**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/website/**'
      - 'docs/**/*.md'
      - '.github/workflows/docs.yml'
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/version-'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/website/package.json

      - name: Install dependencies
        working-directory: docs/website
        run: npm install

      - name: Sync versions.json with existing docs
        working-directory: docs/website
        run: |
          echo "=== Syncing versions.json with existing versioned docs ==="
          echo "[]" > versions.json

          if [ -d "versioned_docs" ]; then
            VERSIONS=$(find versioned_docs -maxdepth 1 -type d -name "version-*" 2>/dev/null | sed 's|.*/version-||' | sort -Vr)
            if [ -n "$VERSIONS" ]; then
              echo "$VERSIONS" | jq -R . | jq -s . > versions.json
            fi
          fi

          rm -rf .docusaurus

      - name: Build documentation
        working-directory: docs/website
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/build

  deploy:
    name: Deploy Documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test:
    name: Test Documentation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/version-'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/website/package.json

      - name: Install dependencies
        working-directory: docs/website
        run: npm install

      - name: Remove versioned docs for PR check
        working-directory: docs/website
        run: |
          rm -rf versioned_docs versioned_sidebars
          echo "[]" > versions.json
          rm -rf .docusaurus

      - name: Build and validate documentation
        working-directory: docs/website
        run: npm run build -- --no-minify
        env:
          NODE_ENV: production
          DISABLE_VERSIONING: 'true'

