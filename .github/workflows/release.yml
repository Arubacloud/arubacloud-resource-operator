name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write      # <-- must be write for gh-release + notes
  packages: write

jobs:
  devtools:
    name: Build Devtools Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache devtools image
        id: cache-devtools
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Build devtools image
        if: steps.cache-devtools.outputs.cache-hit != 'true'
        run: make devtools-image

      - name: Save devtools image to cache
        if: steps.cache-devtools.outputs.cache-hit != 'true'
        run: docker save arubacloud-resource-operator-devtools:local -o /tmp/devtools-image.tar

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [devtools]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore devtools image
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-image.tar
          key: devtools-${{ hashFiles('ci/devtools/Dockerfile') }}

      - name: Load devtools image
        run: |
          docker load -i /tmp/devtools-image.tar
          mkdir -p bin && touch bin/.devtools-image.stamp

      - name: Prepare image environment
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMG=${REGISTRY}/${IMAGE_NAME_LOWER}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "IMG_LATEST=${REGISTRY}/${IMAGE_NAME_LOWER}:latest" >> "$GITHUB_ENV"
          echo "Using versioned image: ${REGISTRY}/${IMAGE_NAME_LOWER}:${GITHUB_REF_NAME}"
          echo "Using latest image: ${REGISTRY}/${IMAGE_NAME_LOWER}:latest"

      # === Build manager binary ===
      - name: Build manager binary
        run: make build-ctzd

      # === Build Docker image ===
      - name: Build Docker image
        run: make docker-build     # uses $IMG from GITHUB_ENV

      # === Login to GitHub Container Registry ===
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Tag and push Docker images ===
      - name: Tag Docker image as latest
        run: docker tag "$IMG" "$IMG_LATEST"

      - name: Push Docker image (versioned)
        run: make docker-push           # uses $IMG from GITHUB_ENV

      - name: Push Docker image (latest)
        run: docker push "$IMG_LATEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            bin/manager
